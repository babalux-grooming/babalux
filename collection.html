<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BABALUX | Product Collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="products-catalog.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#111827;color:#f4f0e8;font-family:"DM Sans",Arial,sans-serif;line-height:1.6}a{color:inherit;text-decoration:none}.container{width:min(1180px,calc(100% - 32px));margin:auto}header{background:#111827;border-bottom:1px solid rgba(214,183,116,.2)}.nav{min-height:76px;display:flex;align-items:center;justify-content:space-between}.logo{font:600 28px "Playfair Display",Georgia,serif;letter-spacing:5px;color:#f5ead1}.back{color:#d6b774}.intro{padding:55px 0 25px}.eyebrow{color:#d6b774;text-transform:uppercase;letter-spacing:3px;font-size:11px}h1{font:600 clamp(36px,6vw,58px) "Playfair Display",Georgia,serif;line-height:1.1;margin:8px 0}.intro p{color:#aaa398}.product-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;padding:15px 0 60px}.product-card{background:#192337;border:1px solid rgba(214,183,116,.16);min-width:0}.product-image{height:240px;display:flex;align-items:center;justify-content:center;background:#1e293b}.product-image img{width:100%;height:100%;object-fit:contain;padding:12px}.product-info{padding:16px}.product-category{font-size:10px;color:#d6b774;text-transform:uppercase;letter-spacing:1.5px}.product-title{font:600 21px "Playfair Display",Georgia,serif;margin:7px 0}.product-description{font-size:13px;color:#aaa398}.product-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid #30384a;padding-top:12px}.price{font:600 20px "Playfair Display",Georgia,serif}.buy-button{background:#d6b774;color:#111;padding:9px 13px;font-size:11px;font-weight:700}.empty{padding:30px 0;color:#aaa398}@media(max-width:850px){.product-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:600px){.product-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.product-image{height:165px}.product-info{padding:10px}.product-title{font-size:15px}.product-description{font-size:11px}.price{font-size:15px}.buy-button{padding:8px;font-size:10px}.logo{font-size:22px}}
</style>
</head>
<body>
<header><div class="container nav"><a class="logo" href="index.html">BABALUX</a><a class="back" href="index.html#collections">← All collections</a></div></header>
<main class="container"><section class="intro"><div class="eyebrow">BABALUX Collections</div><h1 id="collection-title">Professional Products</h1><p id="collection-description">Browse products in this collection.</p></section><div class="product-grid" id="product-grid"></div><p class="empty" id="empty" hidden>No products found in this collection yet.</p></main>
<script src="products-data.js"></script>
<script>
const config={
 scissors:{title:"Hair Scissors",description:"Professional cutting and thinning scissors for precision work.",match:p=>/scissors/i.test(p[2])||/scissors/i.test(p[1])},
 wax:{title:"BABALUX Hair Wax",description:"Explore BABALUX hair wax and styling wax products.",match:p=>/wax/i.test(p[2])||(/babalux/i.test(p[1])&&/wax/i.test(p[1]))},
 combs:{title:"Professional Combs",description:"Professional combs for cutting, sectioning, styling and finishing.",match:p=>/comb/i.test(p[2])||/comb/i.test(p[1])}
};
const key=new URLSearchParams(location.search).get("type");
const collection=config[key]||config.scissors;
document.title="BABALUX | "+collection.title;
document.getElementById("collection-title").textContent=collection.title;
document.getElementById("collection-description").textContent=collection.description;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const products=(window.BABALUX_PRODUCTS||[]).filter(collection.match);
document.getElementById("product-grid").innerHTML=products.map(p=>`<article class="product-card"><a class="product-image" href="product.html?id=${encodeURIComponent(p[0])}" aria-label="View ${esc(p[1])}">${p[4]?`<img src="${esc(p[4])}" alt="${esc(p[1])}" loading="lazy">`:""}</a><div class="product-info"><div class="product-category">${esc(p[2])}</div><h2 class="product-title"><a href="product.html?id=${encodeURIComponent(p[0])}">${esc(p[1])}</a></h2><p class="product-description">${esc(p[5]||"")}</p><div class="product-bottom"><span class="price">${esc(p[3])}</span><a class="buy-button" href="product.html?id=${encodeURIComponent(p[0])}">View</a></div></div></article>`).join("");
document.getElementById("empty").hidden=products.length>0;
</script>
</body></html>
