  "placentrix-plus-intensive-action-10-ampullen": ["Premium Placentrix Ampoules on Marble.png"],
  "impala-metal-cleaning-spray-300ml": ["Impala Metal Cleaning Spray in a Barber Shop.png", "IMPALA Barber Spray Instruction Panel.png"],
  "mefapo-hair-color-spray-120ml": ["Mefapo Color Spray Luxury Vanity Shot.png", "Pastel Hair Colour Spray on Marble.png"],
  "adult-hair-cape-salon-barber-cape": ["adult-hair-cape-salon-barber-cape-1(1).png"],
  "barber-cutting-cape-american-flag": ["Patriotic Smart Hair Cape in Barbershop.png","Patriotic Striped Smart Hair Cape.png"],
  "yellow-scissors-hair-cutting-cloth": ["yellow-scissors-hair-cutting-cloth-1(1).png", "yellow-scissors-hair-cutting-cloth-2(1).png"],
  "bioactive-naturalis-nutritive-mask-cashmere-keratin": ["bioactive-naturalis-nutritive-mask-cashmere-keratin-1(2).png"],
  "farmagan-bioactive-repair-mk-250ml": ["farmagan-bioactive-repair-mk-250ml-1(1).png"],
  "farmagan-bioactive-repair-ampoules": ["farmagan-bioactive-repair-ampoules-1(1).png"],
  "bioactive-naturalis-botanic-shampoo": ["bioactive-naturalis-botanic-shampoo-1(1).png"],
  "bioactive-naturalis-nutritive-fluid": ["bioactive-naturalis-nutritive-fluid-1(1).png"],
  "bioactive-hydra-elixir-booster-100ml": ["bioactive-hydra-elixir-booster-100ml-1(1).png"],
  "double-edge-blade-mat": ["double-edge-blade-mat-1(1).png", "double-edge-blade-mat-2(1).png"],
  "bioactive-hydra-oil": ["bioactive-hydra-oil-1(1).png"],
  "farmagan-placentrix-classic-10-ampoules": ["farmagan-placentrix-classic-10-ampoules-1(1).png"],
  "farmagan-bioactive-hair-care-hydra-mk": ["farmagan-bioactive-hair-care-hydra-mk-1(1).png"],
  "more-for-you-barber-shaving-soap-140g": ["more-for-you-barber-shaving-soap-140g-1(1).png", "more-for-you-barber-shaving-soap-140g-2(1).png"],
  "hairstyles-photo-book": ["hairstyles-photo-book-1(1).png"],
  "professional-case-box-salon-hair-tool": ["Premium Black-and-Gold Barber Organiser.png"],
  "apron-with-pockets-fashion-hairdressing-barber": ["Rugged Barber Apron in a Modern Salon.png"],
  "haircut-cape-hairdresser-cape-for-womens": ["Luxury Salon Cape Display.png"],
  "black-barber-apron-wella": ["BarberTop Apron in a Warm Barbershop.png"],
  "barber-pro-cape": ["Barber Pro Cape in a Luxe Barbershop.png","Vintage Barber Pro Cape in Upscale Barbershop.png"],
  "gentlemans-barber-cape": ["Gentleman’s Barber Cape in Moody Barbershop.png"],
  "skull-barber-cape": ["Skull Cape in a Modern Barbershop.png"],
  "barber-pole-hairdressing-cape": ["Graphic barber cape in modern barbershop.png","Vibrant Barber Cape in Modern Barbershop.png"],
  "fresh-cut-barber-cape": ["Vintage Fresh Cut Barber Cape.png","Vintage Barbershop Cape Display.png"],
  "striped-barber-salon-cape": ["Striped Barber Cape in a Warm Barbershop.png"],
  "afro-twist-hair-sponge": ["Afro Twist Sponge on Glossy Marble.png"],
  "bioactive-hs3-argan-serum": ["Bioactive Argan Serum in Mediterranean Light.png"],
  "eurostar-scissor-brush-holder-box": ["Glossy EuroStar Barber Brush Holder.png"],
  "barber-scissors-storage-holder": ["Barbershop Classic Wooden Tool Holder.png","Vintage Barbershop Scissors Holder.png","Vintage Barbershop Tool Holder Display.png"],
  "more-for-you-professional-disposable-towels": ["More For You Professional Towel Pack.png"],
  "magiccap-reusable-hair-coloring-cap": ["MAGICAP Hair Highlighting Salon Display.png"],
  "milisten-choctaek-professional-foil-roll": ["CHOCTAEK Foil Roll in Emerald Salon.png","CHOCTAEK Professional Foil Roll in Salon Setting.png","Luxury Salon Foil Roll Display.png"],
}; const arkoVariants = [
    {name:"Sensitive", files:["arko-men-shaving-cream-100g-1(1).png","arko-men-shaving-cream-100g-2(1).png"]},
    {name:"Hydrate", files:["arko-men-shaving-cream-100g-3(1).png"]}
  ];
  const solidWaxVariants = [{name:"Black",file:"babalux-solid-wax-black-1.png"},{name:"Green",file:"babalux-solid-wax-green-2.png"},{name:"Yellow",file:"babalux-solid-wax-yellow-3.png"}];
  const waxHeaterVariants = [
    {name:"Orange",file:"wax-heater-500cc-orange-1.png"},
    {name:"Green",file:"wax-heater-500cc-green-1.png"},
    {name:"Grey",file:"wax-heater-500cc-grey-1.png"},
    {name:"Purple",file:"wax-heater-500cc-purple-1.png"},
    {name:"Pink",file:"wax-heater-500cc-pink-1.png"}
  ];
  let galleryImages = product[0] === "babalux-solid-wax" ? solidWaxVariants.map(v => v.file) : product[0] === "wax-heater-500cc" ? waxHeaterVariants.map(v => v.file) : product[0] === "arko-men-shaving-cream-100g" ? arkoVariants[0].files : (galleries[product[0]] || (product[4] ? [product[4]] : []));
  const description = product[5] || "Product details will be added when the source information is available.";

  const galleryMarkup = galleryImages.length ? `
    <div class="gallery">
      <div class="product-visual">
        <button class="gallery-arrow gallery-prev" type="button" aria-label="Previous image">‹</button>
        <div class="gallery-stage" id="gallery-stage">
          <div class="gallery-track" id="gallery-track">
            ${galleryImages.map((src, i) => `
              <div class="gallery-slide">
                <img src="${src}" alt="BABALUX ${product[1]} image ${i + 1}">
              </div>`).join("")}
          </div>
        </div>
        <button class="gallery-arrow gallery-next" type="button" aria-label="Next image">›</button>
      </div>
      ${galleryImages.length > 1 ? `
        <div class="gallery-dots" aria-label="Product image navigation">
          ${galleryImages.map((_, i) => `<button class="gallery-dot ${i === 0 ? "active" : ""}" type="button" aria-label="Go to image ${i + 1}" data-index="${i}"></button>`).join("")}
        </div>
        <div class="gallery-counter"><span id="gallery-current">1</span> / ${galleryImages.length}</div>` : ""}
    </div>` : `
    <div class="product-visual">
      <div class="placeholder"><strong>${product[2]}</strong>Product image coming soon</div>
    </div>`;

  detail.innerHTML = `
    <div class="product-layout">
      ${galleryMarkup}
      <div class="product-copy">
        <div class="category">${product[2]}</div>
        <div class="eyebrow">Product Details</div>
        <h1>${product[1]}</h1>
        <p class="description">${description}</p>
        <div class="meta">${product[6].map(m => `<span class="pill">${m}</span>`).join("")}</div>${product[0] === "babalux-solid-wax" ? `<div class="variant-picker"><span class="variant-label">Choose colour</span><div class="variant-options">${solidWaxVariants.map((v,i) => `<button class="variant-option ${i===0?"active":""}" type="button" data-variant="${i}"><img src="${v.file}" alt="${v.name} Solid Wax"><span>${v.name}</span></button>`).join("")}</div></div>` : product[0] === "wax-heater-500cc" ? `<div class="variant-picker"><span class="variant-label">Choose colour</span><div class="variant-options">${waxHeaterVariants.map((v,i) => `<button class="variant-option ${i===0?"active":""}" type="button" data-variant="${i}"><img src="${v.file}" alt="${v.name} Wax Heater 500 cc"><span>${v.name}</span></button>`).join("")}</div></div>` : product[0] === "arko-men-shaving-cream-100g" ? `<div class="variant-picker"><span class="variant-label">Choose option</span><div class="variant-options">${arkoVariants.map((v,i) => `<button class="variant-option ${i===0?"active":""}" type="button" data-arko-variant="${i}"><img src="${v.files[0]}" alt="${v.name} ARKO MEN Shaving Cream"><span>${v.name}</span></button>`).join("")}</div></div>` : product[0] === "borthe-hair-serum" ? `<div class="variant-picker"><span class="variant-label">Choose formula</span><div class="variant-options">${bortheSerumVariants.map((v,i) => `<button class="variant-option borthe-variant-option ${i===0?"active":""}" type="button" data-borthe-variant="${i}"><span>${v.name}</span></button>`).join("")}</div><div class="borthe-selection-status">Selected: <strong id="borthe-selected">Pro-Keratin</strong></div></div>` : ""}
        <div class="price">${product[3]}</div>
        <button class="buy-button borthe-buy-button" onclick="buyProduct('${product[0]}')">${product[0] === "borthe-hair-serum" ? "Buy Pro-Keratin" : "Buy Now"}</button>
        <div class="note">Secure checkout will be connected to this product.</div>
      </div>
    </div>
  `;

  if (galleryImages.length > 1) {
    const track = document.getElementById("gallery-track");
    const stage = document.getElementById("gallery-stage");
    let dots = [...document.querySelectorAll(".gallery-dot")];
    const current = document.getElementById("gallery-current");
    let index = 0;
    let startX = 0;
    let dragging = false;

    function goTo(nextIndex) {
      index = (nextIndex + galleryImages.length) % galleryImages.length;
      track.style.transform = `translateX(-${index * 100}%)`;
      dots.forEach((dot, i) => dot.classList.toggle("active", i === index));
      if (current) current.textContent = index + 1;
      if (product[0] === "babalux-solid-wax" || product[0] === "wax-heater-500cc") document.querySelectorAll(".variant-option").forEach((b,i) => b.classList.toggle("active", i === index));
    }

    document.querySelector(".gallery-prev").addEventListener("click", () => goTo(index - 1));
    document.querySelector(".gallery-next").addEventListener("click", () => goTo(index + 1));
    dots.forEach(dot => dot.addEventListener("click", () => goTo(Number(dot.dataset.index))));
    if (product[0] === "babalux-solid-wax" || product[0] === "wax-heater-500cc") {
      document.querySelectorAll(".variant-option").forEach(btn => btn.addEventListener("click", () => { const selected = Number(btn.dataset.variant); goTo(selected); document.querySelectorAll(".variant-option").forEach((b,i) => b.classList.toggle("active", i === selected)); }));
    }
    if (product[0] === "borthe-hair-serum") {
    document.querySelectorAll(".variant-option[data-borthe-variant]").forEach(btn => btn.addEventListener("click", () => {
      const selected = Number(btn.dataset.bortheVariant);
      selectedBortheVariant = bortheSerumVariants[selected].name;
      document.querySelectorAll(".variant-option[data-borthe-variant]").forEach((b,i) => b.classList.toggle("active", i === selected));
      const selectedEl = document.getElementById("borthe-selected");
      if (selectedEl) selectedEl.textContent = selectedBortheVariant;
      const descriptionEl = document.querySelector(".description");
      if (descriptionEl) descriptionEl.textContent = bortheSerumVariants[selected].description;
      const buyButton = document.querySelector(".borthe-buy-button");
      if (buyButton) buyButton.textContent = `Buy ${selectedBortheVariant}`;
    }));
  }

  if (product[0] === "arko-men-shaving-cream-100g") {
      document.querySelectorAll(".variant-option[data-arko-variant]").forEach(btn => btn.addEventListener("click", () => {
        const selected = Number(btn.dataset.arkoVariant);
        galleryImages = arkoVariants[selected].files;
        index = 0;
        track.innerHTML = galleryImages.map((src, i) => `<div class="gallery-slide"><img src="${src}" alt="BABALUX ${product[1]} ${arkoVariants[selected].name} image ${i + 1}"></div>`).join("");
        const dotWrap = document.querySelector(".gallery-dots");
        if (dotWrap) dotWrap.innerHTML = galleryImages.map((_, i) => `<button class="gallery-dot ${i === 0 ? "active" : ""}" type="button" aria-label="Go to image ${i + 1}" data-index="${i}"></button>`).join("");
        dots = [...document.querySelectorAll(".gallery-dot")];
        if (current) current.textContent = "1";
        document.querySelectorAll(".variant-option[data-arko-variant]").forEach((b,i) => b.classList.toggle("active", i === selected));
        dots.forEach(dot => dot.addEventListener("click", () => goTo(Number(dot.dataset.index))));
      }));
    }

    stage.addEventListener("touchstart", e => {
      startX = e.touches[0].clientX;
      dragging = true;
    }, {passive:true});

    stage.addEventListener("touchend", e => {
      if (!dragging) return;
      const distance = e.changedTouches[0].clientX - startX;
      dragging = false;
      if (Math.abs(distance) > 45) {
        goTo(distance < 0 ? index + 1 : index - 1);
      }
    }, {passive:true});
  }
}

function buyProduct(id) {
  if (id === "borthe-hair-serum") {
    alert(`Selected formula: ${selectedBortheVariant}. Secure checkout will be connected to this product.`);
    return;
  }
  alert("Secure checkout will be connected to this product.");
}

window.addEventListener("error", function(){
  const fallback=document.getElementById("product-detail");
  if (fallback && !fallback.innerHTML.trim()) {
    fallback.innerHTML='<div class="product-copy"><div class="eyebrow">BABALUX</div><h1>Product loading error</h1><p class="description">Please refresh the page. The product is present in the catalogue.</p></div>';
  }
});
</script>
