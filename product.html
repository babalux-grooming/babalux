
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BABALUX | Product</title>
<meta name="description" content="BABALUX professional grooming and beauty product details.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#0b0b0b;color:#f4f0e8;font-family:"DM Sans",Arial,sans-serif;line-height:1.6}
a{color:inherit;text-decoration:none}
.container{width:min(1180px,calc(100% - 40px));margin:auto}
header{position:sticky;top:0;z-index:10;background:rgba(11,11,11,.94);backdrop-filter:blur(14px);border-bottom:1px solid rgba(214,183,116,.16)}
.nav{min-height:76px;display:flex;align-items:center;justify-content:space-between}
.logo{font:600 28px "Playfair Display",Georgia,serif;letter-spacing:5px;color:#f5ead1}
.nav-links{display:flex;gap:30px;list-style:none;color:#c8c1b5;font-size:14px}
.nav-links a:hover{color:#d6b774}
.product-page{padding:80px 0 110px}
.back-link{display:inline-block;color:#d6b774;text-transform:uppercase;letter-spacing:2px;font-size:11px;margin-bottom:35px}
.product-layout{display:grid;grid-template-columns:1.05fr .95fr;gap:65px;align-items:start}

.gallery{width:100%}
.product-visual{position:relative;min-height:560px;background:radial-gradient(circle,rgba(255,255,255,.07),transparent 50%),#171717;border:1px solid rgba(214,183,116,.14);display:flex;align-items:center;justify-content:center;padding:30px;overflow:hidden}
.gallery-stage{width:100%;touch-action:pan-y;overflow:hidden}
.gallery-track{display:flex;transition:transform .28s ease;will-change:transform}
.gallery-slide{min-width:100%;display:flex;align-items:center;justify-content:center}
.gallery-slide img{width:100%;height:520px;object-fit:contain}
.gallery-arrow{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border:1px solid rgba(214,183,116,.35);background:rgba(11,11,11,.72);color:#d6b774;border-radius:50%;font-size:22px;line-height:1;cursor:pointer;z-index:2}
.gallery-arrow:hover{background:#d6b774;color:#111}
.gallery-prev{left:14px}.gallery-next{right:14px}
.gallery-dots{display:flex;justify-content:center;gap:8px;margin-top:14px}
.gallery-dot{width:8px;height:8px;border:1px solid #d6b774;border-radius:50%;background:transparent;padding:0;cursor:pointer}
.gallery-dot.active{background:#d6b774}
.gallery-counter{text-align:center;margin-top:8px;color:#6f6a63;font-size:11px;letter-spacing:1px}
@media(max-width:800px){.product-visual{min-height:420px}.gallery-slide img{height:390px}}

.product-visual img{width:100%;height:520px;object-fit:contain}
.placeholder{text-align:center;color:#77716a}
.placeholder strong{display:block;color:#d6b774;text-transform:uppercase;letter-spacing:2px;font-size:11px;margin-bottom:10px}
.eyebrow{color:#d6b774;text-transform:uppercase;letter-spacing:4px;font-size:12px;font-weight:700;margin-bottom:15px}
h1{font:600 clamp(42px,6vw,70px)/1.02 "Playfair Display",Georgia,serif;margin:0 0 18px}
.category{color:#d6b774;text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:700;margin-bottom:10px}
.description{color:#aaa39a;font-size:16px;line-height:1.8;max-width:650px;margin-bottom:28px}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
.pill{border:1px solid rgba(214,183,116,.2);padding:8px 11px;color:#c8c1b5;font-size:11px}.variant-picker{margin:0 0 28px}.variant-label{display:block;color:#f5ead1;font-weight:700;margin-bottom:10px}.variant-options{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.variant-option{border:1px solid rgba(214,183,116,.2);background:#121212;color:#f4f0e8;padding:10px;cursor:pointer;text-align:center}.variant-option.active{border-color:#d6b774;box-shadow:inset 0 0 0 1px #d6b774}.variant-option img{width:100%;height:90px;object-fit:contain;background:#171717;margin-bottom:8px}.variant-option span{display:block;font-size:12px}
.price{font:600 31px "Playfair Display",Georgia,serif;color:#f5ead1;margin-bottom:24px}
.buy-button{display:inline-flex;align-items:center;justify-content:center;border:1px solid #d6b774;background:#d6b774;color:#111;padding:15px 25px;font-weight:700;text-transform:uppercase;letter-spacing:1px;cursor:pointer}
.buy-button:hover{background:transparent;color:#d6b774}
.note{margin-top:20px;color:#6f6a63;font-size:12px}
footer{border-top:1px solid rgba(214,183,116,.14);padding:30px 0;background:#080808}
.footer-inner{display:flex;justify-content:space-between;align-items:center}
.footer-logo{font:600 22px "Playfair Display",Georgia,serif;letter-spacing:4px;color:#f5ead1}
.copyright{color:#69655f;font-size:12px}
@media(max-width:800px){.product-layout{grid-template-columns:1fr;gap:35px}.product-visual{min-height:420px}.product-visual img{height:390px}}
@media(max-width:600px){.nav-links{gap:14px;font-size:12px}.nav-links li:nth-child(2){display:none}.product-page{padding-top:55px}.footer-inner{flex-direction:column;gap:10px}}
</style>
</head>
<body>
<header>
  <div class="container nav">
    <a class="logo" href="index.html">BABALUX</a>
    <ul class="nav-links">
      <li><a href="index.html#collections">Collections</a></li>
      <li><a href="index.html#products">Products</a></li>
      <li><a href="index.html#story">About</a></li>
    </ul>
  </div>
</header>

<main class="product-page">
  <div class="container">
    <a class="back-link" href="index.html#products">← Back to products</a>
    <div id="product-detail"></div>
  </div>
</main>

<footer>
  <div class="container footer-inner">
    <div class="footer-logo">BABALUX</div>
    <div class="copyright">© 2026 BABALUX. All rights reserved.</div>
  </div>
</footer>

<script>
const products = [["studio-techno", "STUDIO TECHNO", "Hair Scissors", "£22.99", "studio-techno-2.jpg", "Wide and precise, they allow a precision work keeping softness in the cut sensation.", ["5.5", "6.0"]], ["pro-cut", "PRO CUT", "Razors", "£4.99", "", "Classic half-blade razor for beard and trimming.", ["Half Blade"]], ["pet-scissors", "PET SCISSORS", "Pet Grooming", "£64.99", "", "", ["Thinning Scissors"]], ["sonic-plastic-handle", "SONIC PLASTIC HANDLE SERIES", "Hair Scissors", "£9.99", "", "Model with ergonomic handle and lowered thumb ring for a correct working posture.", ["5.5", "6.0"]], ["studio-techno-relax-th", "STUDIO TECHNO RELAX-TH", "Thinning Scissors", "£26.99", "", "Code 2231. 38-tooth thinning shears with a 40% cutting ratio.", ["2231", "38 Teeth", "40%"]], ["standard-272", "STANDARD HAIR SCISSORS 272", "Thinning Scissors", "£26.99", "", "Code 272. Thinning scissors with half blade and a 30% cutting ratio.", ["272", "30%"]], ["standard-2127", "STANDARD HAIR SCISSORS 2127", "Hair Scissors", "£16.99", "", "Scissors with a classical and multipurpose line for professional people and schools.", ["2127", "6.0", "6.5"]], ["studio-style-2433", "STUDIO STYLE 2433", "Hair Scissors", "£26.99", "", "Scissors with an innovative and functional line, ideal to thin and for cuts of high precision.", ["2433"]], ["studio-style-2431", "STUDIO STYLE 2431", "Thinning Scissors", "£26.99", "studio-style-2431.png", "38-tooth thinning scissors with a 40% cutting ratio.", ["2431", "38 Teeth", "40%"]], ["standard-set", "STANDARD HAIR SCISSORS SET", "Hair Scissors", "£41.99", "standard-hair-scissors-set.jpg", "Unique article including one cutting piece and one thinning piece.", ["Cutting Scissors", "Thinning Scissors"]], ["standard-hair-scissors", "STANDARD HAIR SCISSORS", "Hair Scissors", "£25.99", "standard-hair-scissors.png?v=2", "Linear and tough scissors for a soft and precise cut.", ["6.0", "6.5", "7.0"]], ["gold-series-2471", "GOLD SERIES", "Hair Scissors", "£64.99", "gold-series-1.png", "GOLD series, code 2471, size 5.5. The source product graphic identifies a convex blade and regular configuration.", ["2471", "5.5", "Convex Blade", "Regular"]], ["pro-cut-comb", "PRO CUT", "Razors", "£4.99", "", "Classic razor with half blade and thinning comb.", ["Half Blade", "Thinning Comb"]], ["babalux-hair-wax-04", "BABALUX BARBER 04 AQUA STRONG WAX", "Hair Wax / Styling", "£8.99", "babalux-hair-wax-04-1.png", "BABALUX BARBER 04 AQUA STRONG WAX.", []], ["babalux-spider-hair-wax","BABALUX SPIDER HAIR WAX","Hair Wax / Styling","£7.99","babalux-spider-hair-wax-1.png","BABALUX Spider Hair Wax.",[]],["babalux-hair-wax-03", "BABALUX BARBER 03 AQUA STRONG WAX", "Hair Wax / Styling", "£7.99", "", "BABALUX Hair Wax, Barber 03 Aqua Strong Wax.", ["03"]], ["babalux-hair-wax-01","BABALUX BARBER 01 AQUA STRONG WAX","Hair Wax / Styling","£7.99","babalux-barber-01-image-1.png","BABALUX Hair Wax, Barber 01 Aqua Strong Wax.",["01"]],
["babalux-hair-wax-cream-01","BABALUX HAIR WAX CREAM 01","Hair Wax / Styling","£7.99","babaluxhairwax.cream01.png","BABALUX Hair Wax Cream 01.",["01"]],
["babalux-solid-wax","BABALUX SOLID WAX","Hair Wax / Styling","£5.99","babalux-solid-wax-black-1.png","BABALUX Solid Wax 500ml. Available in Black, Azulen and Natural.",["Black","Azulen","Natural","500ml"]],
["babalux-shaving-gel", "BABALUX SHAVING GEL", "Shaving Gel", "£4.99", "babalux-shaving-gel-1.png?v=3", "A hydration shaving gel formulated with Aloe Vera. Apply to wet skin, massage gently, shave and rinse thoroughly with water. 1000ml.", ["1000ml", "Aloe Vera", "Moisturising Effect"]],["pet-scissors-11041","PET SCISSORS","Pet Grooming","£94.99","pet-scissors-1.png","Pet grooming scissors with blue finger rings. The source product graphic lists Pet Care, Convex Blade, Micro Serrated, Prisma Blade and Regular.",["Pet Care","Convex Blade","Micro Serrated","Prisma Blade","Regular"]],["slim","SLIM","Razors","£3.99","slim-1.png","KIEPE SLIM styling razor, code 122. Includes a pack of 10 blades, code 0141, for hair styling and texturizing.",["KIEPE","Code 122","10 Blades","0141"]]];

const params = new URLSearchParams(window.location.search);
const id = params.get("id");
const product = products.find(p => p[0] === id);
const detail = document.getElementById("product-detail");

if (!product) {
  document.title = "BABALUX | Product not found";
  detail.innerHTML = `
    <div class="eyebrow">BABALUX</div>
    <h1>Product not found</h1>
    <p class="description">The requested product could not be found in the current catalogue.</p>
    <a class="buy-button" href="index.html#products">View Products</a>
  `;
} else {
  document.title = `BABALUX | ${product[1]}`;
  const galleries = {"studio-techno": ["studio-techno-2.png"],
  "pro-cut": ["pro-cut-2.png", "pro-cut-1.png"],
  "pet-scissors": ["pet-scissors-product-image-1.png"],
  "sonic-plastic-handle": ["sonic-plastic-handle-series-1.png"],
  "studio-techno-relax-th": ["studio-techno-relax-th-1.png"],
  "standard-2127": ["standard-hair-scissors-2127.png"],
  "pro-cut-comb": ["pro-cut-thinning-comb.png"],                   
"standard-272": ["standard-hair-scissors-272.png"],
  "gold-series-2471": ["gold-series-1.png"],  "studio-techno": ["studio-techno-2.png"],
  "pet-scissors": ["pet-scissors-product-image-1.png"],
  "sonic-plastic-handle": ["sonic-plastic-handle-series-1.png"],
  "studio-techno-relax-th": ["studio-techno-relax-th-1.png"],
                     "studio-style-2433": ["studio-style-2433.png"],
                     "studio-style-2431": ["studio-style-2431.png"],
                     "standard-set": ["standard-hair-scissors-set.png"],
                     "standard-hair-scissors": ["standard-hair-scissors.png?v=2"],
                     "babalux-hair-wax-04": ["babalux-hair-wax-04-1.png", "babalux-hair-wax-04-2.png"],
                     "babalux-hair-wax-03": ["babalux-hair-wax-03-1.png", "babalux-hair-wax-03-2.jpg"],
  "babalux-hair-wax-01": ["babalux-barber-01-image-1.png", "babalux-barber-01-image-2.png", "babalux-barber-01-image-3.png"],
                     "babalux-spider-hair-wax": ["babalux-spider-hair-wax-1.png", "babalux-spider-hair-wax-2.png"],
                     "babalux-hair-wax-cream-01": ["babaluxhairwax.cream01.png"],
                     "babalux-hair-gel-n4": ["babalux-hair-gel-n4-1.png", "babalux-hair-gel-n4-2.png"],
                     "babalux-shaving-gel": ["babalux-shaving-gel-1.png?v=3", "babalux-shaving-gel-2.png?v=3"],
                     "pet-scissors-11041": ["pet-scissors-1.png"],
                     "slim": ["slim-1.png"]
                     

};
  const solidWaxVariants = [{name:"Black",file:"babalux-solid-wax-black-1.png"},{name:"Green",file:"babalux-solid-wax-green-2.png"},{name:"Yellow",file:"babalux-solid-wax-yellow-3.png"}];
  const galleryImages = product[0] === "babalux-solid-wax" ? solidWaxVariants.map(v => v.file) : (galleries[product[0]] || (product[4] ? [product[4]] : []));
  const description = product[5] || "Product details will be added when the source information is available.";

  const galleryMarkup = galleryImages.length ? `
    <div class="gallery">
      <div class="product-visual">
        <button class="gallery-arrow gallery-prev" type="button" aria-label="Previous image">‹</button>
        <div class="gallery-stage" id="gallery-stage">
          <div class="gallery-track" id="gallery-track">
            ${galleryImages.map((src, i) => `
              <div class="gallery-slide">
                <img src="${src}" alt="BABALUX ${product[1]} image ${i + 1}">
              </div>`).join("")}
          </div>
        </div>
        <button class="gallery-arrow gallery-next" type="button" aria-label="Next image">›</button>
      </div>
      ${galleryImages.length > 1 ? `
        <div class="gallery-dots" aria-label="Product image navigation">
          ${galleryImages.map((_, i) => `<button class="gallery-dot ${i === 0 ? "active" : ""}" type="button" aria-label="Go to image ${i + 1}" data-index="${i}"></button>`).join("")}
        </div>
        <div class="gallery-counter"><span id="gallery-current">1</span> / ${galleryImages.length}</div>` : ""}
    </div>` : `
    <div class="product-visual">
      <div class="placeholder"><strong>${product[2]}</strong>Product image coming soon</div>
    </div>`;

  detail.innerHTML = `
    <div class="product-layout">
      ${galleryMarkup}
      <div class="product-copy">
        <div class="category">${product[2]}</div>
        <div class="eyebrow">Product Details</div>
        <h1>${product[1]}</h1>
        <p class="description">${description}</p>
        <div class="meta">${product[6].map(m => `<span class="pill">${m}</span>`).join("")}</div>${product[0] === "babalux-solid-wax" ? `<div class="variant-picker"><span class="variant-label">Choose colour</span><div class="variant-options">${solidWaxVariants.map((v,i) => `<button class="variant-option ${i===0?"active":""}" type="button" data-variant="${i}"><img src="${v.file}" alt="${v.name} Solid Wax"><span>${v.name}</span></button>`).join("")}</div></div>` : ""}
        <div class="price">${product[3]}</div>
        <button class="buy-button" onclick="buyProduct('${product[0]}')">Buy Now</button>
        <div class="note">Secure checkout will be connected to this product.</div>
      </div>
    </div>
  `;

  if (galleryImages.length > 1) {
    const track = document.getElementById("gallery-track");
    const stage = document.getElementById("gallery-stage");
    const dots = [...document.querySelectorAll(".gallery-dot")];
    const current = document.getElementById("gallery-current");
    let index = 0;
    let startX = 0;
    let dragging = false;

    function goTo(nextIndex) {
      index = (nextIndex + galleryImages.length) % galleryImages.length;
      track.style.transform = `translateX(-${index * 100}%)`;
      dots.forEach((dot, i) => dot.classList.toggle("active", i === index));
      if (current) current.textContent = index + 1;
      if (product[0] === "babalux-solid-wax") document.querySelectorAll(".variant-option").forEach((b,i) => b.classList.toggle("active", i === index));
    }

    document.querySelector(".gallery-prev").addEventListener("click", () => goTo(index - 1));
    document.querySelector(".gallery-next").addEventListener("click", () => goTo(index + 1));
    dots.forEach(dot => dot.addEventListener("click", () => goTo(Number(dot.dataset.index))));
    if (product[0] === "babalux-solid-wax") {
      document.querySelectorAll(".variant-option").forEach(btn => btn.addEventListener("click", () => { const selected = Number(btn.dataset.variant); goTo(selected); document.querySelectorAll(".variant-option").forEach((b,i) => b.classList.toggle("active", i === selected)); }));
    }

    stage.addEventListener("touchstart", e => {
      startX = e.touches[0].clientX;
      dragging = true;
    }, {passive:true});

    stage.addEventListener("touchend", e => {
      if (!dragging) return;
      const distance = e.changedTouches[0].clientX - startX;
      dragging = false;
      if (Math.abs(distance) > 45) {
        goTo(distance < 0 ? index + 1 : index - 1);
      }
    }, {passive:true});
  }
}

function buyProduct(id) {
  alert("Secure checkout will be connected to this product.");
}
</script>
</body>
</html>
