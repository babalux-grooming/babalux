      if (button) {
        button.disabled = false;
        button.title = "The selected option can be saved; its final price must be confirmed.";
      }
      if (note) note.textContent = "You can save this option in your cart, but its price needs confirmation before checkout.";
    } else {
      if (priceNode) priceNode.textContent = (selected && selected.price) || product[3];
      if (button) {
        button.disabled = false;
        button.title = "";
      }
      if (note) note.textContent = "Your selected size or option will be saved in your cart. Secure Stripe checkout will be connected separately.";
    }

    const badge = document.getElementById("variant-image-badge");
    if (badge) {
      badge.textContent = selected && selected.showImageBadge ? selected.label : "";
      badge.style.display = selected && selected.showImageBadge ? "block" : "none";
    }
    if (selected && selected.label) {
      document.querySelectorAll(".gallery-slide img").forEach(img => {
        img.alt = "BABALUX " + product[1] + " — " + selected.label;
      });
    } else {
      document.querySelectorAll(".gallery-slide img").forEach((img, index) => {
        img.alt = "BABALUX " + product[1] + " image " + (index + 1);
      });
    }
  }

  function refreshCartLinkCount() {
    if (window.updateBabaluxCartCount) window.updateBabaluxCartCount();
  }

  const addToCartButton = document.getElementById("add-to-cart-button");
  if (addToCartButton) {
    addToCartButton.addEventListener("click", function () {
      const selected = getCurrentVariant();
      const priceConfirmed = !selected || selected.priceConfirmed !== false;
      const priceText = priceConfirmed ? ((selected && selected.price) || product[3]) : "Price to be confirmed";
      const unitPrice = priceConfirmed ? (Number(String(priceText).replace(/[^0-9.]/g, "")) || 0) : null;
      const variantLabel = selected ? selected.label : "";
      const variantKey = selected ? selected.key : "standard";
      const cartItem = {
        key: product[0] + "::" + variantKey,
        id: product[0],
        name: product[1],
        variant: variantLabel,
        priceText: priceText,
        unitPrice: unitPrice,
        priceConfirmed: priceConfirmed,
        image: (selected && selected.image) || product[4],
        quantity: 1
      };

      let cart = window.getBabaluxCart ? window.getBabaluxCart() : [];
      const existing = cart.find(item => item.key === cartItem.key);
      if (existing) {
        existing.quantity = Math.min(99, Math.max(1, Number(existing.quantity) || 1) + 1);
      } else {
        cart.push(cartItem);
      }

      const saved = window.saveBabaluxCart ? window.saveBabaluxCart(cart) : false;
      const feedback = document.getElementById("cart-feedback");
      if (!saved) {
        if (feedback) {
          feedback.textContent = "Your browser could not save the cart. Please allow site storage and try again.";
          feedback.classList.add("show");
        }
        return;
      }

      refreshCartLinkCount();
      if (feedback) {
        feedback.replaceChildren();
        feedback.appendChild(document.createTextNode(product[1] + (variantLabel ? " — " + variantLabel : "") + " added to your cart. "));
        const link = document.createElement("a");
        link.href = "cart.html";
        link.textContent = "View cart";
        feedback.appendChild(link);
        feedback.classList.add("show");
      }
    });
  }

  detail.addEventListener("click", function (event) {
    if (event.target.closest(".variant-option")) updateSelectedVariantPresentation();
  });
  updateSelectedVariantPresentation();

}

window.addEventListener("error", function(){
  const fallback=document.getElementById("product-detail");
  if (fallback && !fallback.innerHTML.trim()) {
    fallback.innerHTML='<div class="product-copy"><div class="eyebrow">BABALUX</div><h1>Product loading error</h1><p class="description">Please refresh the page. The product is present in the catalogue.</p></div>';
  }
});
</script>
</body>
</html>
